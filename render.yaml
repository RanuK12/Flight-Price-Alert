# Render Blueprint — Flight Deal Bot v7.0
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: flight-price-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    # v7.0: 30 destinos EU, 5 orígenes AR, fechas rolling 12 meses.
    # MongoDB Atlas como persistencia principal.
    # SQLite solo como fallback local si MONGODB_URI no está configurado.
    envVars:
      # --- Telegram (configurar valor en el dashboard de Render) ---
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_POLLING
        value: "true"

      # --- Amadeus Production (configurar en el dashboard) ---
      - key: AMADEUS_API_KEY
        sync: false
      - key: AMADEUS_API_SECRET
        sync: false
      - key: AMADEUS_BASE_URL
        value: https://api.amadeus.com
      - key: AMADEUS_RATE_LIMIT_RPS
        value: "8"
      - key: AMADEUS_MONTHLY_BUDGET
        value: "2000"
      - key: AMADEUS_DAILY_BUDGET
        value: "66"
      - key: AMADEUS_CONFIRM_STEALS
        value: "true"

      # --- Runtime ---
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: TZ
        value: America/Argentina/Buenos_Aires
      - key: PORT
        value: "4000"

      # --- Puppeteer (scraper fallback) ---
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"

      # --- Scheduler ---
      - key: AUTO_MONITOR
        value: "true"
      # Cada hora x 40 rutas = 960 chequeos/dia. Con 640 rutas activas eso da
      # ~1,5 revisiones por ruta por dia (antes: 1 cada 2,7 dias).
      - key: MONITOR_SCHEDULE
        value: "0 * * * *"
      - key: MAX_ROUTES_PER_PASS
        value: "40"
      - key: DAILY_REPORT_SCHEDULE
        value: "0 21 * * *"

      # --- Cache ---
      - key: CACHE_TTL_MS
        value: "21600000"
      - key: CACHE_TTL_GF_MS
        value: "3600000"

      # --- DB ---
      - key: MONGODB_URI
        sync: false
      - key: SQLITE_PATH
        value: /app/data/flights.db

      # --- Scraper ---
      # 45s de presupuesto para ida sola (Playwright puede tardar hasta ~44s:
      # goto 30s + selector 12s + lazy 2s). Los roundtrips usan 2,5x porque
      # pueden disparar la busqueda de las dos piernas por separado.
      - key: SCRAPER_TIMEOUT_MS
        value: "45000"
